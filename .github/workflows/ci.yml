name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          # The macos-26 image's Xcode.app symlink is the newest installed Xcode.
          # swift test builds the package for this Mac, and the package requires macOS 26.
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          swift --version
          mac_sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK ${mac_sdk}"
          test "${mac_sdk%%.*}" -ge 26

      - name: Test the package
        run: swift test
